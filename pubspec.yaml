name: aura_ai
description: "Aura AI - Real Production Personal AI Stylist & Fashion Intelligence"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1
  
  # Production Real AI & Backend Services
  google_generative_ai: ^0.4.0
  supabase_flutter: ^2.3.4
  dio: ^5.4.1
  
  # Real Hardware, Camera & Sensors
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  connectivity_plus: ^5.0.2
  
  # Local Storage & Security
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  uuid: ^4.3.3
  intl: ^0.19.0
  
  # UI & Design System
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  font_awesome_flutter: ^10.7.0
  gap: ^3.0.1
  smooth_page_indicator: ^1.1.0
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
